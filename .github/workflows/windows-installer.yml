name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [ccr-d5c74dc0-175va0]
    paths:
      - "app/**"
      - "deploy/windows/installer/**"
      - "requirements.txt"
      - "sales_*.json"
      - "sales_contract_template.txt"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build NamTour-Setup.exe
        shell: pwsh
        run: ./deploy/windows/installer/build.ps1 -Version "1.0.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: NamTour-Setup
          path: build/NamTour-Setup.exe
          retention-days: 30
