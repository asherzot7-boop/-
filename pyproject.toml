[project]
name = "nashriyot-ai"
version = "0.1.0"
description = "Нашриёт учун Telegram орқали бошқариладиган AI агентлар тизими"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py312"
