<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Агент Nam Tour в 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a full-height 3D stage with four actors; a chat panel docked right (desktop) or bottom (phone) shows the
   real message that is travelling. Single dark look: cobalt, turquoise, violet, saffron over ink. */
:root {
  --ink: #060B15; --glass: rgba(10, 18, 32, 0.82); --line: rgba(160, 190, 230, 0.16);
  --fg: #E7EEF7; --muted: #8EA0B8; --turq: #45C9C3; --saffron: #F2C66D; --violet: #A88BF2; --cobalt: #5B8CFF;
  --font-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --font-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 12px/1 var(--font-body); color: var(--fg);
  background: rgba(6, 11, 21, 0.75); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; will-change: transform; }
.lbl.agent { font: 500 12px/1 var(--font-display); background: rgba(15, 138, 135, 0.9); border-color: transparent; }
.lbl.phase { font: 600 10px/1 var(--font-mono); color: var(--muted); background: rgba(6, 11, 21, 0.6); }
.lbl.phase.on { color: var(--saffron); border-color: rgba(242, 198, 109, .6); }
.top { position: fixed; z-index: 3; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; }
.title { pointer-events: auto; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; max-width: min(640px, 100%); }
.title h1 { margin: 0; font: 700 15px/1.25 var(--font-display); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: 600 12px var(--font-body); color: var(--muted); background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--fg); border-color: var(--turq); }
.chat { position: fixed; z-index: 3; right: max(12px, env(safe-area-inset-right, 0px)); top: 120px; bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  width: min(380px, 34vw); background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line);
  border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
.chat header { padding: 10px 14px; border-bottom: 1px solid var(--line); font: 600 11px var(--font-mono); color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.feed { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.m { max-width: 92%; display: flex; flex-direction: column; gap: 3px; animation: in .35s ease both; }
.m .w { font: 600 10px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.m .w b { font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--saffron); }
.m .b { padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.45; }
.m.client { align-self: flex-end; align-items: flex-end; } .m.client .b { background: #2B5DB8; border-bottom-right-radius: 4px; }
.m.agent .b { background: rgba(69, 201, 195, .12); border: 1px solid rgba(69, 201, 195, .35); border-bottom-left-radius: 4px; }
.m.manager .b { background: #E7EEF7; color: #060B15; font-family: var(--font-mono); font-size: 12px; }
.m.manager_in { align-self: stretch; max-width: 100%; } .m.manager_in .b { background: rgba(168, 139, 242, .14); border-left: 3px solid var(--violet); border-radius: 8px; font-size: 12px; }
.m.system { align-self: center; max-width: 100%; } .m.system .b { color: var(--muted); font-size: 12px; text-align: center; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); border-radius: 0; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bar { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px; align-items: center; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; max-width: calc(100vw - 24px); }
.bar button { font: 600 13px var(--font-body); color: var(--fg); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 9px; height: 36px; min-width: 40px; padding: 0 10px; cursor: pointer; }
.bar button.primary { background: #1D4E9E; border-color: #1D4E9E; }
.bar button:focus-visible, .tab:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.prog { width: min(220px, 30vw); height: 6px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--turq), var(--saffron)); }
.cnt { font: 600 11px var(--font-mono); color: var(--muted); min-width: 52px; text-align: center; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
@media (max-width: 760px) {
  .chat { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; top: auto; height: 34vh;
    bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  .title { padding: 8px 10px; } .title h1 { font-size: 13px; }
  .lbl { font-size: 10px; padding: 4px 7px; }
  .prog { display: none; }
}
@media (prefers-reduced-motion: reduce) { .m { animation: none; } }
</style>

<div id="stage" aria-label="3D: клиент, агент, менеджер и система обмениваются сообщениями"></div>
<div id="labels"></div>
<div class="top"><div class="title"><h1>Агент Nam Tour в 3D: настоящие диалоги</h1><div class="tabs" id="tabs" role="tablist"></div></div></div>
<section class="chat" aria-live="polite"><header><span id="scenName"></span><span id="tagNow"></span></header><div class="feed" id="feed"></div></section>
<div class="bar">
  <button id="prev" aria-label="Назад">⏮</button>
  <button id="play" class="primary" aria-label="Пауза">⏸</button>
  <button id="next" aria-label="Вперёд">⏭</button>
  <button id="speed" aria-label="Скорость">1×</button>
  <div class="prog"><i id="progbar"></i></div>
  <span class="cnt" id="cnt"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const DATA = __DATA__;
const SCEN = [
  { key: "passport", name: "Паспорт → депорт", channel: "Telegram", color: 0x2AABEE },
  { key: "deport", name: "Депорт с рекламы", channel: "Instagram", color: 0xE1306C },
  { key: "work", name: "Документы работодателя", channel: "WhatsApp", color: 0x25D366 },
];
const ROLE = { client: "Клиент", agent: "Агент", manager: "Менеджер · команда", manager_in: "Менеджеру в Telegram", system: "Система" };
const PHASES = [
  { name: "Продажа", tags: ["База знаний", "Подтверждение", "Карточка менеджеру", "Без обещаний гарантий", "Источник рекламы"] },
  { name: "Документы", tags: ["Согласие", "Чек-лист документов", "Напоминание"] },
  { name: "Оплата", tags: ["Payme", "Договор и счёт PDF"] },
  { name: "Статус", tags: ["Статус заявки", "Команда менеджера"] },
  { name: "Итог", tags: ["Отзыв и реферальный код", "Допродажа", "Недельный отчёт"] },
];

(function () {
  const $ = id => document.getElementById(id);
  const stage = $("stage"), labelsEl = $("labels");
  if (!window.THREE) { const f = document.createElement("div"); f.className = "fallback"; f.textContent = "Не удалось загрузить three.js."; document.body.appendChild(f); return; }
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch (e) { const f = document.createElement("div"); f.className = "fallback"; f.textContent = "WebGL недоступен."; document.body.appendChild(f); return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060B15);
  scene.fog = new THREE.FogExp2(0x060B15, 0.035);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  scene.add(new THREE.HemisphereLight(0x8fb0e0, 0x0a1020, 0.7));
  const key = new THREE.PointLight(0xffffff, 1.0, 60); key.position.set(4, 10, 10); scene.add(key);
  const glow = new THREE.PointLight(0x45C9C3, 1.6, 18); scene.add(glow);
  const world = new THREE.Group(); scene.add(world);

  // ---------- floor: a faint 8-point-star tile grid (InstancedMesh, 1 draw call)
  const tileShape = new THREE.Shape();
  for (let i = 0; i < 16; i++) { const r = i % 2 ? 0.3 : 0.48, a = i / 16 * Math.PI * 2 + Math.PI / 8; i ? tileShape.lineTo(Math.cos(a) * r, Math.sin(a) * r) : tileShape.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  const tileGeo = new THREE.ShapeGeometry(tileShape); tileGeo.rotateX(-Math.PI / 2);
  const tiles = new THREE.InstancedMesh(tileGeo, new THREE.MeshBasicMaterial({ color: 0x16336B, transparent: true, opacity: 0.55 }), 900);
  const m4 = new THREE.Matrix4(); let ti = 0;
  for (let x = -15; x <= 15 && ti < 900; x++) for (let z = -15; z <= 15 && ti < 900; z++) { if (x * x + z * z > 220) continue; m4.makeTranslation(x * 1.1, -2.6, z * 1.1); tiles.setMatrixAt(ti++, m4); }
  tiles.count = ti; world.add(tiles);

  // ---------- actors
  function star(size, color) {
    const s = new THREE.Shape();
    for (let i = 0; i < 16; i++) { const r = (i % 2 ? .62 : 1) * size, a = i / 16 * Math.PI * 2 + Math.PI / 8; i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
    const g = new THREE.ExtrudeGeometry(s, { depth: size * .3, bevelEnabled: true, bevelThickness: size * .07, bevelSize: size * .05, bevelSegments: 2 }); g.center();
    return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, emissive: 0x0f5c5a, metalness: .3, roughness: .35 }));
  }
  const actors = {
    agent: star(1.15, 0x45C9C3),
    client: new THREE.Mesh(new THREE.SphereGeometry(.7, 32, 32), new THREE.MeshStandardMaterial({ color: 0x2AABEE, emissive: 0x2AABEE, emissiveIntensity: .35, roughness: .3 })),
    manager: new THREE.Mesh(new THREE.CylinderGeometry(.62, .62, 1.3, 6), new THREE.MeshStandardMaterial({ color: 0xA88BF2, emissive: 0x6A4BC4, emissiveIntensity: .35, roughness: .35 })),
    system: new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xF2C66D, emissive: 0xB87A12, emissiveIntensity: .3, roughness: .4 })),
  };
  Object.values(actors).forEach(a => world.add(a));
  const halo = new THREE.Mesh(new THREE.TorusGeometry(2.05, .02, 8, 160), new THREE.MeshBasicMaterial({ color: 0xF2C66D, transparent: true, opacity: .55 }));
  halo.rotation.x = Math.PI / 2; world.add(halo);
  // phase markers on a ring around the agent
  const phaseMarks = PHASES.map((p, i) => {
    const a = -Math.PI / 2 + i / PHASES.length * Math.PI * 2, m = new THREE.Mesh(new THREE.SphereGeometry(.13, 16, 16), new THREE.MeshBasicMaterial({ color: 0x33445e }));
    m.position.set(Math.cos(a) * 2.05, 0, Math.sin(a) * 2.05); world.add(m); return m;
  });
  // links between actors
  const linkMat = new THREE.LineBasicMaterial({ color: 0x5B8CFF, transparent: true, opacity: .22 });
  const links = [];

  // ---------- labels
  const labels = [];
  function label(obj, text, cls, dy) { const s = document.createElement("span"); s.className = "lbl " + (cls || ""); s.textContent = text; labelsEl.appendChild(s); const L = { obj, s, dy: dy || 0, w: 80, h: 22 }; labels.push(L); requestAnimationFrame(() => { L.w = s.offsetWidth; L.h = s.offsetHeight; }); return L; }
  const lClient = label(actors.client, "Клиент", "", -1.05);
  label(actors.agent, "Сотув агенти", "agent", -1.55);
  label(actors.manager, "Менеджер · Telegram", "", -1.1);
  label(actors.system, "Система · Payme · база", "", -0.95);
  const phaseLabels = PHASES.map((p, i) => label(phaseMarks[i], p.name, "phase", -0.35));

  // ---------- layout (landscape: a row; portrait: a column so nothing leaves the phone screen)
  let portrait = false;
  function layout() {
    const w = stage.clientWidth, h = stage.clientHeight; portrait = w < h * 0.9;
    const P = portrait
      ? { client: [0, 0, -5.4], agent: [0, 0, 0], manager: [-2.4, 0, 5.0], system: [2.4, 0, 5.0] }
      : { client: [-6.2, 0, 0], agent: [0, 0, 0], manager: [6.2, 0, 0], system: [0, 0, 4.6] };
    Object.entries(P).forEach(([k, v]) => actors[k].position.set(v[0], v[1], v[2]));
    links.forEach(l => { world.remove(l); l.geometry.dispose(); }); links.length = 0;
    [["client", "agent"], ["agent", "manager"], ["agent", "system"]].forEach(([a, b]) => {
      const g = new THREE.BufferGeometry().setFromPoints(curve(a, b).getPoints(40)); const l = new THREE.Line(g, linkMat); world.add(l); links.push(l);
    });
    const vf = camera.fov * Math.PI / 180, aspect = w / h, hf = 2 * Math.atan(Math.tan(vf / 2) * aspect);
    const chatW = w > 760 ? Math.min(380, w * 0.34) + 24 : 0;
    const usable = Math.max(0.35, 1 - chatW / w);
    const halfX = portrait ? 4.2 : 7.6, halfZ = portrait ? 10.5 : 5.0;
    const d = Math.max(halfX / (Math.tan(hf / 2) * usable), halfZ / Math.tan(vf / 2) * (portrait ? 1.25 : 1.0)) * 1.05;
    camera.position.set(0, d * 0.78, d * 0.62 + (portrait ? 2.5 : 0));
    camera.lookAt(0, 0, portrait ? 1.2 : 0.8);
    // shift the picture left when the chat panel covers the right side
    camera.setViewOffset(w, h, chatW / 2, portrait ? h * 0.14 : 0, w, h);
    camera.updateProjectionMatrix();
  }
  function curve(a, b) {
    const A = actors[a].position.clone(), B = actors[b].position.clone(), M = A.clone().add(B).multiplyScalar(.5); M.y += 2.2;
    return new THREE.QuadraticBezierCurve3(A, M, B);
  }
  function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; layout(); }
  new ResizeObserver(resize).observe(stage);

  // ---------- packets: one flight per event (sender -> receiver)
  const ROUTE = { client: ["client", "agent"], agent: ["agent", "client"], manager: ["manager", "agent"], manager_in: ["agent", "manager"], system: ["system", "agent"] };
  const COLOR = { client: 0x5B8CFF, agent: 0x45C9C3, manager: 0xE7EEF7, manager_in: 0xA88BF2, system: 0xF2C66D };
  const packetGeo = { ball: new THREE.SphereGeometry(.2, 16, 16), doc: new THREE.BoxGeometry(.34, .44, .05), coin: new THREE.CylinderGeometry(.26, .26, .07, 24) };
  const flights = [];
  function launch(e) {
    const [a, b] = ROUTE[e.who] || ["system", "agent"];
    const shape = e.kind === "file" ? "doc" : (e.tag === "Payme" ? "coin" : "ball");
    const color = e.tag === "Payme" ? 0xF2C66D : COLOR[e.who];
    const mesh = new THREE.Mesh(packetGeo[shape], new THREE.MeshBasicMaterial({ color }));
    const trail = [0, 1, 2, 3].map(k => { const t = new THREE.Mesh(packetGeo.ball, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .35 - k * .08 })); t.scale.setScalar(.6 - k * .1); world.add(t); return t; });
    world.add(mesh);
    flights.push({ mesh, trail, curve: curve(a, b), t: 0, dur: reduce ? .01 : .95, to: b });
  }
  const pulse = { client: 0, agent: 0, manager: 0, system: 0 };

  // ---------- playback of the real transcript
  let sc = 0, idx = -1, playing = true, speed = 1, nextAt = 0, clock = 0;
  const feed = $("feed");
  function addBubble(e) {
    const m = document.createElement("div"); m.className = "m " + e.who;
    const w = document.createElement("div"); w.className = "w"; w.textContent = ROLE[e.who] + (e.kind === "push" ? " · сам" : "");
    if (e.tag) { const b = document.createElement("b"); b.textContent = e.tag; w.appendChild(b); }
    const body = document.createElement("div"); body.className = "b"; body.textContent = (e.kind === "file" ? "📎 " : "") + e.text;
    if (e.who !== "system") m.appendChild(w);
    m.appendChild(body); feed.appendChild(m); feed.scrollTop = feed.scrollHeight;
  }
  function phaseOn(n) { phaseMarks.forEach((m, i) => { m.material.color.set(i < n ? 0xF2C66D : 0x33445e); phaseLabels[i].s.classList.toggle("on", i < n); }); }
  let reached = 0;
  function show(i, animate) {
    const evs = DATA[SCEN[sc].key];
    idx = i; const e = evs[i];
    if (animate) launch(e);
    addBubble(e);
    $("tagNow").textContent = e.tag || "";
    const p = PHASES.findIndex(ph => ph.tags.includes(e.tag));
    if (p >= 0) reached = Math.max(reached, p + 1);
    phaseOn(reached);
    $("cnt").textContent = `${i + 1} / ${evs.length}`;
    $("progbar").style.width = ((i + 1) / evs.length * 100) + "%";
    nextAt = clock + Math.min(3.2, 1.0 + e.text.length * .012) / speed;
  }
  function rebuildTo(i) { feed.replaceChildren(); reached = 0; phaseOn(0); for (let k = 0; k <= i; k++) show(k, k === i); }
  function selectScenario(i) {
    sc = i; const s = SCEN[i];
    actors.client.material.color.set(s.color); actors.client.material.emissive.set(s.color);
    lClient.s.textContent = "Клиент · " + s.channel;
    requestAnimationFrame(() => { lClient.w = lClient.s.offsetWidth; });
    $("scenName").textContent = s.name;
    document.querySelectorAll(".tab").forEach((t, k) => t.setAttribute("aria-selected", String(k === i)));
    feed.replaceChildren(); reached = 0; phaseOn(0); idx = -1; nextAt = clock + .6;
    try { history.replaceState(null, "", "#" + s.key); } catch (e) {}
  }
  SCEN.forEach((s, i) => { const b = document.createElement("button"); b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab"); b.textContent = s.name; b.onclick = () => selectScenario(i); $("tabs").appendChild(b); });
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "⏸" : "▶"; $("play").setAttribute("aria-label", playing ? "Пауза" : "Пуск"); nextAt = clock + .3; };
  $("next").onclick = () => { const n = DATA[SCEN[sc].key].length; if (idx < n - 1) show(idx + 1, true); };
  $("prev").onclick = () => { if (idx > 0) rebuildTo(idx - 1); };
  $("speed").onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; $("speed").textContent = (speed === .5 ? "½" : speed) + "×"; };

  // ---------- loop (no allocations: vectors reused)
  const v = new THREE.Vector3(), tmp = new THREE.Vector3(); let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, .05); last = now; clock += dt;
    const evs = DATA[SCEN[sc].key];
    if (playing && clock >= nextAt) {
      if (idx < evs.length - 1) show(idx + 1, true);
      else { nextAt = clock + 4; if (idx === evs.length - 1) { idx = evs.length; } else { selectScenario((sc + 1) % SCEN.length); } }
    }
    for (let i = flights.length - 1; i >= 0; i--) {
      const f = flights[i]; f.t += dt / f.dur * speed;
      const t = Math.min(1, f.t), ease = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      f.curve.getPoint(ease, f.mesh.position);
      f.mesh.rotation.y += dt * 4;
      f.trail.forEach((tr, k) => f.curve.getPoint(Math.max(0, ease - (k + 1) * .045), tr.position));
      if (t >= 1) { pulse[f.to] = 1; world.remove(f.mesh); f.mesh.material.dispose(); f.trail.forEach(tr => { world.remove(tr); tr.material.dispose(); }); flights.splice(i, 1); }
    }
    Object.entries(actors).forEach(([k, a]) => { pulse[k] *= Math.exp(-dt * 4); const s = 1 + pulse[k] * .35; a.scale.setScalar(s); });
    const t = clock;
    actors.agent.rotation.z += dt * .5; actors.agent.rotation.y = Math.sin(t * .6) * .4; actors.agent.position.y = Math.sin(t * 1.2) * .15;
    actors.manager.rotation.y += dt * .4; actors.system.rotation.y -= dt * .5; actors.system.rotation.x = Math.sin(t * .5) * .2;
    halo.rotation.z += dt * .2; glow.intensity = 1.4 + pulse.agent * 3; glow.position.copy(actors.agent.position).y += 1.2;
    renderer.render(scene, camera);
    const w = stage.clientWidth, h = stage.clientHeight;
    for (const L of labels) {
      L.obj.getWorldPosition(v); v.y += L.dy; v.project(camera);
      const hw = L.w / 2, hh = L.h / 2;
      const x = Math.min(w - hw - 6, Math.max(hw + 6, (v.x * .5 + .5) * w)), y = Math.min(h - hh - 6, Math.max(hh + 6, (-v.y * .5 + .5) * h));
      L.s.style.transform = `translate(${(x - hw).toFixed(1)}px,${(y - hh).toFixed(1)}px)`;
    }
  }
  resize();
  const start = SCEN.findIndex(s => "#" + s.key === location.hash);
  selectScenario(start >= 0 ? start : 0);
  requestAnimationFrame(frame);
})();
</script>
